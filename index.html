<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizDAW</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1>QuizDAW</h1>
  
    <p id="saludo" class="muted"></p>
    <div class="barra">
      <button type="button" id="btnTema" class="secundario">Cambiar tema</button>
      <!-- ERROR: El onclick="location.href..." entraba en conflicto con el addEventListener de app.js -->
      <button type="button" id="btnResultados" class="secundario">Ver resultados</button>
      <button type="button" id="btnBorrar" class="peligro">Borrar datos</button>
      <!-- En la sección de la barra (<div class="barra">) añade este botón: -->
      <button type="button" id="btnContrarreloj" class="secundario">Modo Contrarreloj</button>
    </div>
  </header>

  <section id="inicio" class="card">
    <h2>¿Listo?</h2>
    <p>5 preguntas sobre desarrollo web. ¡Suerte!</p>
    <button type="button" id="btnEmpezar">Empezar</button>
  </section>

  <section id="juego" class="card" hidden>
    <!-- En la sección del juego (<section id="juego">) añade la etiqueta del temporizador justo antes de textoPregunta -->
    <div id="temporizador" class="muted" style="font-weight: bold; font-size: 1.2rem; color: #d64545; margin-bottom: 8px;"></div>
    <h2 id="textoPregunta"></h2>
    <div id="opciones"></div>
    <p id="feedback" class="feedback"></p>
    <button type="button" id="btnSiguiente" hidden>Siguiente</button>
    <p id="marcador" class="muted"></p>
  </section>

  <section id="final" class="card" hidden>
    <h2>Fin de la partida</h2>
    <p id="textoFinal"></p>
    <!-- Contenedor dinámico para el récord -->
    <div id="recordMensaje"></div>
    <button type="button" id="btnOtra">Jugar otra vez</button>
  </section>

  <section class="card">
    <h2>Últimas partidas</h2>
    <ul id="listaPartidas"></ul>
    <p id="media" class="muted"></p>
    <!-- Contenedor para mostrar el récord en la pantalla principal -->
    <p id="recordGuardado" class="muted" style="margin-top: 8px; font-weight: 600;"></p>
  </section>

  <footer>
    <p id="info" class="muted"></p>
  </footer>

<script src="preguntas.js"></script>
<script src="partida.js"></script>
<script src="cookies.js"></script>
<script src="app.js"></script>
</body>
</html>
